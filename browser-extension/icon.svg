<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Calendar icon -->
  <rect x="32" y="40" width="64" height="56" rx="4" fill="white"/>
  <rect x="32" y="40" width="64" height="16" rx="4" fill="#f7b500"/>

  <!-- Calendar grid -->
  <line x1="48" y1="64" x2="48" y2="88" stroke="#667eea" stroke-width="2"/>
  <line x1="64" y1="64" x2="64" y2="88" stroke="#667eea" stroke-width="2"/>
  <line x1="80" y1="64" x2="80" y2="88" stroke="#667eea" stroke-width="2"/>
  <line x1="40" y1="72" x2="88" y2="72" stroke="#667eea" stroke-width="2"/>
  <line x1="40" y1="80" x2="88" y2="80" stroke="#667eea" stroke-width="2"/>

  <!-- Plus sign -->
  <circle cx="96" cy="96" r="18" fill="#4285f4"/>
  <line x1="96" y1="86" x2="96" y2="106" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="86" y1="96" x2="106" y2="96" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
